name: Build & Release Desktop App (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه مورد نظر برای انتشار (مثال: 1.3.9)'
        required: false
        default: '1.3.9'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VER=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//')
          else
            CLEAN_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Building UniSchedule Version: $CLEAN_VER"

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build Application & Electron Binaries
        shell: bash
        run: |
          npm run build -- --base=./
          npx electron-builder --publish never

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: UniSchedule v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 تغییرات و قابلیت‌های جدید در نسخه v${{ steps.get_version.outputs.version }}
            
            ### 🏫 بانک دروس و پارسرهای دانشگاهی (کاتالوگ):
            - 🏛️ **پشتیبانی رسمی از سامانه بهستان دانشگاه صنعتی خواجه نصیرالدین طوسی (گزارش ۱۰۲)** در کنار دانشگاه صنعتی امیرکبیر (گزارش ۲۱۲).
            - ➕ **قابلیت افزودن چند فایل HTML:** امکان ادغام فایل‌های مربوط به دانشکده‌های مختلف به بانک دروس با حفظ دروس قبلی.
            - 📥 **پشتیبانی کامل از Drag & Drop:** کشیدن و رها کردن مستقیم فایل‌های HTML داخل باکس آپلود.
            - 🛡️ **جلوگیری از ترکیب دروس دانشگاه‌های مختلف:** تشخیص هوشمند دانشگاه فایل و مسدودسازی تداخل با پاپ‌آپ اختصاصی.
            - ☑️ **چک‌باکس و عملیات گروهی:** قابلیت انتخاب چندگانه دروس، انتخاب همه، پنهان‌سازی (Hide) و حذف گروهی از بانک دروس.
            - 👁️‍🗨️ **فیلتر دروس پنهان‌شده:** امکان مدیریت و آشکارسازی مجدد دروسی که پنهان شده‌اند.
            - 🎭 **پاپ‌آپ انتخاب هویت دانشجو:** در صورت ورود فایل متعلق به دانشجوی دیگر.

            ### 📋 مدیریت پیشرفته سناریوها (پلان‌های انتخاب واحد):
            - 🆕 **پنجره ساخت سناریو جدید:** پیشنهاد خودکار نام (سناریوی ب، ج و...) و محدودیت ۳۰ کاراکتری با شمارنده زنده.
            - ✏️ **ویرایش نام سناریوها:** امکان تغییر نام هر سناریو و نام دلخواه برنامه اصلی.
            - 📑 **تکثیر سریع سناریو (Duplicate):** کپی کامل یک سناریو به همراه تمام دروس آن.
            - 🗑️ **حذف هوشمند سناریو:** حذف مستقیم سناریوهای خالی و تأییدیه هوشمند برای سناریوهای دارای درس.
            - 📱 **منوی کشویی ریسپانسیو در موبایل:** دسترسی سریع به تمام امکانات سناریوها در صفحات کوچک.

            ### 📅 جدول هفتگی و سایر بهبودها:
            - 👨‍🏫 **نمایش نام استاد:** نام استاد روی تمام کارت‌های دروس در جدول هفتگی کلاس‌ها نمایش داده می‌شود.
            - 📢 **پنجره اعلان به‌روزرسانی (Changelog):** نمایش تغییرات جدید به همراه گزینه «دیگر نشان نده» و همگام‌سازی دوطرفه با حافظه.
            - ✈️ **کانال رسمی تلگرام UniSchedule:** برای اطلاع‌رسانی سریع از آپدیت‌ها ([t.me/UniSchedule_aut](https://t.me/UniSchedule_aut)).
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

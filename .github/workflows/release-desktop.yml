name: Build & Release Desktop App (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه مورد نظر برای انتشار (مثال: 1.3.9)'
        required: false
        default: '1.3.9'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VER=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//')
          else
            CLEAN_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Building UniSchedule Version: $CLEAN_VER"

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build Application & Electron Binaries
        shell: bash
        run: |
          npm run build -- --base=./
          npx electron-builder --publish never

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: UniSchedule v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            <div dir="rtl">

            ## 🚀 تغییرات و قابلیت‌های جدید نسخه ۱.۶.۰ `UniSchedule`

            - 🏛️ **پشتیبانی از دانشگاه شهید بهشتی (`SBU`):**
              - پشتیبانی کامل از هر دو گزارش ۱۰۲ و ۲۱۲ سامانه بهستان دانشگاه شهید بهشتی برای استخراج دروس
              - راهنمای تصویری گام‌به‌گام و اختصاصی به همراه نکات مهم بارگذاری برای دانشجویان شهید بهشتی
            - 🔄 **ارتقای سیستم انتخاب از بانک دروسِ جدول هفتگی:**
              - امکان کلیک مستقیم روی درس‌های ثبت‌شده در جدول هفتگی جهت باز شدن بانک دروس با فیلتر همان بازه زمانی (جهت مقایسه و تعویض آسان دروس)
            - 🧹 **دکمه بازنشانی تمام فیلترها در بانک دروس:**
              - اضافه شدن دکمه کاربردی «بازنشانی فیلترها» که در صورت فعال بودن هر یک از فیلترها فعال شده و با یک کلیک وضعیت را به حالت اولیه برمی‌گرداند
            - ☕ **سیستم حمایت مالی و دونیت (رِیمیت):**
              - اضافه شدن درگاه حمایت‌مالی با اتصال مستقیم به درگاه امن رِیمیت جهت حمایت دانشجویان از تداوم توسعه پروژه رایگان `UniSchedule`

            ---
            ✈️ **کانال رسمی تلگرام `UniSchedule`:** [`@UniSchedule_aut`](https://t.me/UniSchedule_aut)

            </div>
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

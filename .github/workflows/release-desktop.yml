name: Build & Release Desktop App (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه مورد نظر برای انتشار (مثال: 1.3.9)'
        required: false
        default: '1.3.9'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VER=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//')
          else
            CLEAN_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Building UniSchedule Version: $CLEAN_VER"

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build Application & Electron Binaries
        shell: bash
        run: |
          npm run build -- --base=./
          npx electron-builder --publish never

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: UniSchedule v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            <div dir="rtl">

            ## 🚀 تغییرات و قابلیت‌های جدید نسخه ۱.۴.۲ `UniSchedule`

            در این به‌روزرسانی، ابزارهای فیلترینگ بانک دروس بسیار کامل‌تر شده، سرعت برنامه افزایش یافته و تجربه کاربری در تمامی بخش‌ها (به‌ویژه نسخه دسکتاپ `Windows`) بسیار روان‌تر و زیباتر شده است:

            - **🎯 فیلتر هوشمند جنسیت دروس:** امکان تفکیک و مشاهده کلاس‌ها بر اساس جنسیت (مختلط، آقایان، بانوان) با برچسب‌های رنگی و خوانا.
            - **⏰ فیلتر بر اساس بازه ساعت کلاس:** اضافه شدن ابزار انتخاب ساعت برای پیدا کردن سریع دروسی که دقیقاً در زمان‌های آزاد شما برگزار می‌شوند.
            - **⚡ سرعت بالا و حذف خودکار دروس تکراری:** حذف هوشمند سطرهای تکراری فایل دانشگاه هنگام بارگذاری، جهت جلوگیری از کندی و لگ در جستجو.
            - **⚠️ هشدار هوشمند برای گروه‌های دیگر یک درس:** اگر درسی را برداشته باشید و در بانک دروس گروه دیگری از همان درس را ببینید، با برچسب مشخص به شما اطلاع داده می‌شود.
            - **🔄 جایگزینی بی‌نقص دروس دارای تداخل:** ارتقای دکمه جایگزینی تا درس قبلی با یک کلیک کاملاً حذف شده و درس جدید بدون هیچ خطایی جای آن را بگیرد.
            - **🎨 طراحی جدید و چشم‌نواز فیلترها:** کادر فیلترها هنگام فعال بودن هایلایت رنگی می‌گیرند و یک دکمه ضربدر برای پاک کردن سریع متن جستجو اضافه شده است.
            - **🛡️ پنجره‌های تایید مدرن و هماهنگ با تم:** جایگزینی کامل کادرهای قدیمی با پنجره‌های اختصاصی و زیبای برنامه (سازگار با دارک‌مود) و حل مشکل گیر کردن کلیک‌ها و دکمه‌ها در نسخه `Windows`.

            ---
            ✈️ **کانال رسمی تلگرام UniSchedule:** [t.me/UniSchedule_aut](https://t.me/UniSchedule_aut)

            </div>
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

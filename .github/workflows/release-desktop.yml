name: Build & Release Desktop App (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه مورد نظر برای انتشار (مثال: 1.3.9)'
        required: false
        default: '1.3.9'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VER=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//')
          else
            CLEAN_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Building UniSchedule Version: $CLEAN_VER"

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build Application & Electron Binaries
        shell: bash
        run: |
          npm run build -- --base=./
          npx electron-builder --publish never

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: UniSchedule v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 تغییرات و قابلیت‌های جدید در نسخه v${{ steps.get_version.outputs.version }}
            
            ### 🔄 ذخیره‌سازی هوشمند و بارگذاری مجدد فایل‌های کاتالوگ:
            - 💾 **ذخیره‌سازی خودکار فایل‌های HTML:** ذخیره تمام فایل‌های وارد شده در حافظه امن مرورگر (`IndexedDB`) برای جلوگیری از آپلود مجدد.
            - 🔄 **دکمه بارگذاری مجدد (X فایل):** پردازش دوباره تمامی منابع ذخیره‌شده و بازنشانی وضعیت دروس پنهان‌شده یا حذف‌شده تنها با یک کلیک.
            - 💡 **کارت بازیابی در حالت بانک خالی:** امکان بازیابی فوری و لود مجدد دروس بدون نیاز به انتخاب فایل از کامپیوتر.

            ### 🏛️ ارتقای موتور پردازش دانشگاه خواجه‌نصیر (KNTU Parser):
            - 🗓️ **پشتیبانی کامل از دروس چندجلسه‌ای:** تشخیص و استخراج دقیق تمام روزها و ساعات هفتگی برای دروس ۳ واحدی و ۲ جلسه‌ای در طول هفته.
            - 📍 **استخراج مکان و زمان‌بندی جلسات:** نمایش دقیق زمان‌ها و اطلاعات مکان در کارت‌های درس و جدول هفتگی.

            ### ⚡ پایداری و بهینه‌سازی:
            - 🛠️ **اصلاح ساختار رندرینگ:** بهبود ساختار هوک‌های ری‌اکت در بانک دروس جهت بارگذاری سریع و پایدار بدون وقفه.
            - 📢 **پنجره اعلان به‌روزرسانی (v1.4.1):** اطلاع‌رسانی امکانات جدید با قابلیت همگام‌سازی وضعیت نمایش.
            - ✈️ **کانال رسمی تلگرام UniSchedule:** برای دریافت سریع اخبار و نسخه‌ها ([t.me/UniSchedule_aut](https://t.me/UniSchedule_aut)).
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

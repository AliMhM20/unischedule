name: Build & Release Desktop App (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه مورد نظر برای انتشار (مثال: 1.6.1)'
        required: false
        default: '1.6.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VER=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//')
          else
            CLEAN_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Building UniSchedule Version: $CLEAN_VER"

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build Application & Electron Binaries
        shell: bash
        run: |
          npm run build -- --base=./
          npx electron-builder --publish never

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: UniSchedule v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            <div dir="rtl">

            ## 🚀 پچ جدید ۱.۶.۱ `UniSchedule` و رفع باگ‌های گزارش‌شده

            در این به‌روزرسانی دو مورد از باگ‌های گزارش‌شده برطرف شد، سیستم پرینت برنامه بازطراحی گردید و قابلیت کاربردی «ستاره‌دار کردن دروس» اضافه شد:

            - ⭐ **قابلیت «ستاره‌دار کردن» دروس (دروس برگزیده و اولویت‌دار):**
              - امکان ستاره‌دار کردن دروسی که اهمیت بیشتری نسبت به باقی دروس دارند در سراسر سامانه (بانک دروس، جدول هفتگی، سایدبار و تقویم امتحانات)
              - اضافه شدن گزینه «دروس ستاره‌دار» به فیلتر انتخاب وضعیت دروس در بانک دانشگاه جهت تفکیک و دسترسی بسیار سریع‌تر به دروس اولویت‌دار

            - 🖨️ **تحول اساسی در سیستم پرینت و خروجی برنامه دانشجو (`Print 2.0`):**
              - تغییر بزرگ در سیستم پرینت گرفتن از برنامه هفتگی با بازطراحی رابط کاربری و بهبود تجربه کاربری
              - امکانات و تنظیمات کاربردی شامل پیش‌نمایش زنده، تغییر چیدمان (افقی/عمودی)، تم‌های چاپی رنگی و سیاه‌وسفید اداری، درج مشخصات دانشجو و دانشگاه، و خروجی برداری متنی باکیفیت وکتور در `PDF`

            - 🛠️ **رفع باگ‌ها و بهبود پایداری:**
              - رفع مشکل بیرون‌زدگی و به‌هم‌ریختگی کادر فیلتر زمان کلاس داخل بانک دروس
              - اصلاح نحوه نمایش و فونت کد دروس و شماره گروه‌ها مطابق استاندارد (`کد درس_کد گروه`)

            ---
            ✈️ **کانال رسمی تلگرام `UniSchedule`:** [`@UniSchedule_aut`](https://t.me/UniSchedule_aut)

            </div>
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
